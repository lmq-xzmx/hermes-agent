<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes File Manager</title>
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --border: #30363d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --success: #3fb950;
    --danger: #f85149;
    --warning: #d29922;
    --sidebar-width: 220px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
</style>
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;">
    <div>
      <h1>Hermes File Manager</h1>
      <p style="color:var(--text-secondary);margin-top:16px;">此页面已被 Vue SPA 替代，不再用于生产构建。</p>
      <p style="color:var(--text-secondary);margin-top:8px;">请使用 <code style="background:var(--bg-tertiary);padding:2px 8px;border-radius:4px;">vue.html</code> 访问应用。</p>
      <div style="margin-top:32px;padding:16px;background:var(--bg-secondary);border-radius:8px;border:1px solid var(--border);text-align:left;max-width:500px;">
        <h3 style="color:var(--accent);margin-bottom:12px;">架构说明</h3>
        <ul style="color:var(--text-secondary);line-height:1.8;font-size:14px;list-style:none;padding:0;">
          <li>✅ <strong>vue.html</strong> - Vue 3 SPA 入口（Tauri 主窗口）</li>
          <li>✅ <strong>floating-vue.html</strong> - 浮窗入口</li>
          <li>✅ <strong>src/platformAdapter.js</strong> - Tauri 平台适配器</li>
          <li>✅ <strong>src/main.js</strong> - Vue 应用入口</li>
        </ul>
      </div>
      <p style="color:var(--text-secondary);margin-top:24px;font-size:13px;">
        Platform Adapter 已迁移至 <code>src/platformAdapter.js</code>
      </p>
      <p style="color:var(--text-secondary);margin-top:16px;font-size:12px;">
        更多信息：<a href="vue改造/VUE3迁移工作文档.md" style="color:var(--accent);">Vue 迁移进度</a>
      </p>
    </div>
  </div>
</body>
</html>
