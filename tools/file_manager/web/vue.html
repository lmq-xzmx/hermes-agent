<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes File Manager - Vue</title>
  <link rel="stylesheet" href="/src/assets/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family-text);
      font-size: 17px;
      line-height: 1.47;
      letter-spacing: -0.374px;
      background: var(--color-surface-tile-1);
      color: var(--color-body-on-dark);
    }
    button, a, input, select { min-height: 44px; }
    .btn:active, button:active { transform: scale(0.95); }
    .global-nav {
      background-color: var(--color-surface-black);
      color: var(--color-body-on-dark);
      height: 44px;
      font-size: 12px;
      letter-spacing: -0.12px;
    }
    .btn-primary {
      background-color: var(--color-primary);
      color: var(--color-body-on-dark);
      border-radius: var(--radius-pill);
      padding: 11px 22px;
      font-size: 17px;
      letter-spacing: -0.374px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn-primary:active { transform: scale(0.95); }
    .btn-secondary {
      background-color: transparent;
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-pill);
      padding: 11px 22px;
      font-size: 17px;
      letter-spacing: -0.374px;
      cursor: pointer;
    }
    .btn-dark {
      background-color: var(--color-ink);
      color: var(--color-body-on-dark);
      border-radius: var(--radius-sm);
      padding: 8px 15px;
      font-size: 14px;
      letter-spacing: -0.224px;
      border: none;
      cursor: pointer;
    }
    .search-input {
      background-color: var(--color-canvas);
      color: var(--color-ink);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: var(--radius-pill);
      padding: 12px 20px;
      height: 44px;
      font-size: 17px;
      letter-spacing: -0.374px;
      outline: none;
    }
    .search-input:focus { outline: 2px solid var(--color-primary-focus); }
    .card {
      background-color: var(--color-surface-tile-2);
      color: var(--color-body-on-dark);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .text-muted { color: var(--color-body-muted); }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
