# Lifecycle Constraint Configuration
# Source of truth for lifecycle constraint rules
# Loaded by: engine/lifecycle_engine.py (backend)
# Served via: /api/v1/lifecycle/config (frontend)

lifecycle:
  enabled: true
  debug: false
  cache_ttl: 300

# Constraint rules by action
rules:

  # ─────────────────────────────────────────────────────────
  # upload_file
  # ─────────────────────────────────────────────────────────
  upload_file:
    - code: NOT_SPACE_MEMBER
      constraint_type: pre_check
      description: User must be a member of a space/team
      error_template: "请先加入团队或空间才能上传文件"
      guidance:
        label: "加入团队"
        icon: "👥"
        path: "/teams"
      priority: 1

    - code: QUOTA_SUFFICIENT
      constraint_type: quota
      description: Space must have sufficient quota
      error_template: "存储配额已用尽，无法上传新文件"
      guidance:
        label: "查看回收站"
        icon: "🗑️"
        path: "/trash"
      priority: 2

    - code: QUOTA_RESERVED
      constraint_type: quota
      description: Concurrent upload quota reservation
      error_template: "当前有文件正在上传，配额已被临时占用"
      guidance:
        label: "刷新状态"
        icon: "🔄"
        action: "refreshQuota"
      priority: 3

  # ─────────────────────────────────────────────────────────
  # create_team
  # ─────────────────────────────────────────────────────────
  create_team:
    - code: NO_AVAILABLE_POOL
      constraint_type: pre_check
      description: At least one active storage pool must exist
      error_template: "系统暂无可用存储池，请联系管理员创建"
      guidance:
        label: "联系管理员"
        icon: "📧"
        action: "contact_admin"
      priority: 1

  # ─────────────────────────────────────────────────────────
  # delete_pool
  # ─────────────────────────────────────────────────────────
  delete_pool:
    - code: STORAGE_POOL_IN_USE
      constraint_type: pre_check
      description: team_count check - pool must have no teams
      error_template: "该存储池仍有团队使用，无法删除"
      guidance:
        label: "查看团队"
        icon: "👥"
        path: "/admin/teams"
      priority: 1

    - code: POOL_TEAMS_MIGRATING
      constraint_type: state
      description: team_migrating_count check - no teams currently migrating
      error_template: "该存储池有团队正在迁移中"
      guidance:
        label: "查看迁移进度"
        icon: "🔄"
        path: "/admin/teams?status=migrating"
      priority: 2

  # ─────────────────────────────────────────────────────────
  # delete_space
  # ─────────────────────────────────────────────────────────
  delete_space:
    - code: SPACE_NO_MEMBERS
      constraint_type: pre_check
      description: Space must have no active members
      error_template: "该空间仍有成员，无法删除"
      guidance:
        label: "查看成员"
        icon: "👥"
        path: "/space/members"
      priority: 1

    - code: SPACE_HAS_PENDING_REQUESTS
      constraint_type: pre_check
      description: No pending private space requests
      error_template: "该空间有待审核的私人空间申请"
      guidance:
        label: "查看申请"
        icon: "📋"
        path: "/space/requests"
      priority: 2

  # ─────────────────────────────────────────────────────────
  # invite_member
  # ─────────────────────────────────────────────────────────
  invite_member:
    - code: NOT_SPACE_OWNER
      constraint_type: permission
      description: Only space owner can invite members
      error_template: "只有空间所有者可以邀请成员"
      guidance:
        label: "联系管理员"
        icon: "📧"
        action: "contact_admin"
      priority: 1

    - code: MEMBER_RECENTLY_REMOVED
      constraint_type: pre_check
      description: was_recently_removed check - member should not be recently removed
      error_template: "该成员刚被移除，请稍后再尝试邀请"
      guidance:
        label: "确定"
        icon: "✓"
        action: "dismiss"
      priority: 2

  # ─────────────────────────────────────────────────────────
  # delete_team
  # ─────────────────────────────────────────────────────────
  delete_team:
    - code: NOT_TEAM_OWNER
      constraint_type: permission
      description: Only team owner can delete team
      error_template: "只有团队所有者可以删除团队"
      guidance:
        label: "联系管理员"
        icon: "📧"
        action: "contact_admin"
      priority: 1

  # ─────────────────────────────────────────────────────────
  # join_team
  # ─────────────────────────────────────────────────────────
  join_team:
    - code: CREDENTIAL_VALID
      constraint_type: pre_check
      description: Invite credential must be valid
      error_template: "邀请码已过期或无效"
      guidance:
        label: "返回"
        icon: "🔙"
        path: "/teams"
      priority: 1

  # ─────────────────────────────────────────────────────────
  # create_private_space
  # ─────────────────────────────────────────────────────────
  create_private_space:
    - code: NOT_TEAM_MEMBER
      constraint_type: pre_check
      description: User must be a team member
      error_template: "只有团队成员才能申请私人空间"
      guidance:
        label: "加入团队"
        icon: "👥"
        path: "/teams"
      priority: 1

  # ─────────────────────────────────────────────────────────
  # check_quota
  # ─────────────────────────────────────────────────────────
  check_quota:
    - code: QUOTA_EXCEEDED
      constraint_type: quota
      description: Space quota must not be exceeded
      error_template: "存储配额已用尽，无法上传新文件"
      guidance:
        label: "查看回收站"
        icon: "🗑️"
        path: "/trash"
      priority: 1

  # ─────────────────────────────────────────────────────────
  # update_quota
  # ─────────────────────────────────────────────────────────
  update_quota:
    - code: NOT_QUOTA_OWNER
      constraint_type: permission
      description: Only space owner can update quota
      error_template: "只有空间所有者可以修改配额"
      guidance:
        label: "联系管理员"
        icon: "📧"
        action: "contact_admin"
      priority: 1

# Guidance action callbacks (frontend must implement)
guidance_callbacks:
  contact_admin:
    label: "联系管理员"
    icon: "📧"
  refreshQuota:
    label: "刷新状态"
    icon: "🔄"
  dismiss:
    label: "确定"
    icon: "✓"
