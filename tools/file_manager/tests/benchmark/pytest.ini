[pytest]
testpaths = tests/benchmark
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers

markers =
    benchmark: Performance benchmark tests (P95 < 150ms)
    ws_benchmark: WebSocket performance tests (< 100ms)
    stability: Long-running stability tests
    slow: Slow running tests (> 5 minutes)
    load: Load/stress tests (100+ concurrent users)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
