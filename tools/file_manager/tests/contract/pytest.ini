[pytest]
# Contract Test Configuration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Markers
markers =
    contract: Contract tests (Schemathesis + OpenAPI)
    openapi: OpenAPI schema validation tests
    integration: Integration tests
    slow: Slow running tests

# Test paths
testpaths = tests/contract

# Environment variables
env =
    TEST_API_BASE_URL=http://localhost:8000

# Coverage options (if pytest-cov installed)
# addopts = --cov=src --cov-report=html --cov-report=term

# Timeout (if pytest-timeout installed)
# timeout = 300

# Logging
log_cli = false
log_cli_level = INFO
