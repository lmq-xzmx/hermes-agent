# Hermes File Manager CI/CD Build Workflow
# TASK-009: 实现 CI/CD 自动化

name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: cd web && npm ci && cd ..

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}

      - name: Build frontend
        run: cd web && npm run build && cd ..

      - name: Verify bundle
        run: ./scripts/verify-bundle.sh

      - name: Build Tauri
        run: cd src-tauri && cargo tauri build && cd ..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: Hermes-File-Manager-darwin
          path: src-tauri/target/release/bundle/macos/*.app

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run frontend tests
        run: cd web && npm ci && npm test && cd ..

  release:
    runs-on: macos-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Hermes-File-Manager-darwin
          path: .

      - name: Create ZIP archive
        run: |
          zip -r Hermes-File-Manager-macOS.zip Hermes\ File\ Manager.app

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Hermes-File-Manager-macOS.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
